        <rect x="34" y="86" width="100" height="30" rx="10" class="m2"/><rect x="62" y="52" width="42" height="34" rx="8" class="m3"/>
        <rect x="98" y="28" width="14" height="52" rx="7" class="m3"/><rect x="108" y="36" width="70" height="8" rx="4" class="gold"/>
        <rect x="18" y="98" width="22" height="44" rx="8" class="m4"/><rect x="46" y="120" width="18" height="62" rx="8" class="m4"/><rect x="86" y="120" width="18" height="62" rx="8" class="m4"/>
        <text x="12" y="188" class="label">Linebreaker Walker</text>
      </g>
      <g transform="translate(232,0)">
        <rect width="214" height="216" rx="16" fill="#11151c"/>
        <rect x="24" y="108" width="112" height="28" rx="10" class="m2"/><polygon points="30 104 82 72 144 80 176 112 136 126 54 128" class="m3"/>
        <rect x="138" y="96" width="58" height="8" rx="4" class="blue"/><rect x="20" y="142" width="24" height="16" rx="8" class="m4"/><rect x="50" y="142" width="24" height="16" rx="8" class="m4"/><rect x="80" y="142" width="24" height="16" rx="8" class="m4"/>
        <text x="12" y="188" class="label">AA Bastion</text>
      </g>
      <g transform="translate(464,0)">
        <rect width="214" height="216" rx="16" fill="#11151c"/>
        <rect x="18" y="114" width="124" height="28" rx="10" class="m2"/><rect x="56" y="84" width="58" height="30" rx="8" class="m3"/>
        <rect x="106" y="92" width="74" height="8" rx="4" class="gold"/><circle cx="40" cy="154" r="18" class="m1"/><circle cx="106" cy="154" r="18" class="m1"/>
        <text x="12" y="188" class="label">Mobile Artillery</text>
      </g>
    </g>
    <text x="20" y="322" class="note">큰 유닛은 RTS 시점에서도 다리 구조, 포신 길이, 센서 마스트, 차체 질량감이 달라 보여야 한다.</text>
  </g>

  <g transform="translate(36,506)">
    <rect width="1528" height="338" rx="20" fill="#181b22" stroke="#6c563f" stroke-width="2"/>
    <text x="20" y="30" class="label">Armor / Support / Air</text>
    <g transform="translate(24,74)">
      <g transform="translate(0,0)">
        <rect width="210" height="172" rx="16" fill="#11151c"/>
        <rect x="22" y="94" width="116" height="34" rx="12" class="m2"/><rect x="56" y="66" width="50" height="28" rx="8" class="m3"/><rect x="98" y="74" width="70" height="8" rx="4" class="gold"/>
        <text x="12" y="150" class="label">Assault Tank</text>
      </g>
      <g transform="translate(236,0)">
        <rect width="210" height="172" rx="16" fill="#11151c"/>
        <rect x="18" y="100" width="126" height="30" rx="12" class="m2"/><polygon points="24 96 70 68 134 76 166 104 132 116 48 118" class="m3"/><rect x="136" y="92" width="56" height="8" rx="4" class="blue"/>
        <text x="12" y="150" class="label">Command APC</text>
      </g>
      <g transform="translate(472,0)">
        <rect width="210" height="172" rx="16" fill="#11151c"/>
        <rect x="14" y="102" width="132" height="28" rx="12" class="m2"/><rect x="50" y="74" width="62" height="28" rx="8" class="m3"/><rect x="104" y="58" width="14" height="24" rx="6" class="m3"/><rect x="118" y="68" width="70" height="8" rx="4" class="red"/>
        <text x="12" y="150" class="label">Siege Carrier</text>
      </g>
      <g transform="translate(708,0)">
        <rect width="210" height="172" rx="16" fill="#11151c"/>
        <polygon points="18 106 88 54 166 62 196 104 146 122 64 124" class="m2"/><polygon points="74 64 118 34 160 46 132 72 90 72" class="m3"/><rect x="146" y="98" width="50" height="8" rx="4" class="gold"/>
        <text x="12" y="150" class="label">Strike Gunship</text>
      </g>
      <g transform="translate(944,0)">
        <rect width="560" height="172" rx="16" fill="#11151c"/>
        <text x="16" y="28" class="label">Detail Rules</text>
        <text x="16" y="58" class="note">- 색보다 실루엣과 장비 레이어가 먼저 읽혀야 한다.</text>
        <text x="16" y="82" class="note">- 어깨, 실드, 포탑, 엔진, 궤도, 다리, 백팩으로 역할을 구분한다.</text>
        <text x="16" y="106" class="note">- 가능하면 wreck 실루엣도 따로 준비한다.</text>
        <text x="16" y="130" class="note">- 모든 모델을 한 번에 바꾸지 말고 대표 유닛 4~6종부터 완성한다.</text>
      </g>
    </g>
  </g>
</svg>