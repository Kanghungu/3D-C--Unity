<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .title { font: 800 34px 'Segoe UI', Arial, sans-serif; fill: #f3ead8; }
    .sub { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #e0c9ab; }
    .label { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #f0dcb1; }
    .note { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #d7c7b5; }
    .m1 { fill: #171d25; } .m2 { fill: #2e3946; } .m3 { fill: #718397; } .m4 { fill: #495767; }
    .gold { fill: #efc474; } .blue { fill: #89d7f4; } .red { fill: #d56f58; }
  </style>
  <rect width="1600" height="900" fill="#171920"/>
  <rect x="18" y="18" width="1564" height="864" rx="24" fill="#111318" stroke="#7f6348" stroke-width="3"/>
  <text x="48" y="72" class="title">GROUND UNIT DETAIL BOARD</text>
  <text x="48" y="102" class="sub">보병, 워커, 전차, 포병, 지원 병기가 서로 다른 실루엣과 레이어를 가져야 한다</text>

  <g transform="translate(36,132)">
    <rect width="744" height="340" rx="20" fill="#181b22" stroke="#6c563f" stroke-width="2"/>
    <text x="20" y="30" class="label">Infantry Families</text>
    <g transform="translate(24,60)">
      <g transform="translate(0,0)">
        <rect width="156" height="236" rx="16" fill="#11151c"/>
        <circle cx="50" cy="34" r="14" class="m3"/><path d="M26 52 L74 52 L86 120 L14 120 Z" class="m2"/>
        <rect x="82" y="76" width="62" height="10" rx="5" class="gold"/><rect x="30" y="120" width="14" height="64" rx="7" class="m3"/><rect x="54" y="120" width="14" height="64" rx="7" class="m3"/>
        <text x="12" y="210" class="label">Rifleman</text>
      </g>
      <g transform="translate(174,0)">
        <rect width="156" height="236" rx="16" fill="#11151c"/>
        <circle cx="50" cy="34" r="14" class="m3"/><path d="M28 52 L76 52 L88 124 L16 124 Z" class="m2"/>
        <rect x="0" y="64" width="42" height="92" rx="10" class="blue"/><rect x="84" y="82" width="58" height="8" rx="4" class="gold"/>
        <rect x="34" y="124" width="14" height="64" rx="7" class="m3"/><rect x="58" y="124" width="14" height="64" rx="7" class="m3"/>
        <text x="12" y="210" class="label">Shield Unit</text>
      </g>
      <g transform="translate(348,0)">
        <rect width="156" height="236" rx="16" fill="#11151c"/>
        <circle cx="48" cy="34" r="14" class="m3"/><path d="M28 52 L72 52 L84 114 L16 114 Z" class="m2"/>
        <rect x="80" y="70" width="62" height="8" rx="4" class="blue"/><rect x="90" y="84" width="52" height="8" rx="4" class="gold"/>
        <rect x="34" y="114" width="14" height="72" rx="7" class="m3"/><rect x="56" y="114" width="14" height="72" rx="7" class="m3"/>
        <text x="12" y="210" class="label">Marksman</text>
      </g>
      <g transform="translate(522,0)">
        <rect width="156" height="236" rx="16" fill="#11151c"/>
        <circle cx="52" cy="34" r="14" class="m3"/><path d="M22 52 L86 52 L98 132 L10 132 Z" class="m2"/>
        <rect x="88" y="78" width="54" height="12" rx="6" class="red"/><rect x="92" y="96" width="50" height="8" rx="4" class="gold"/>
        <rect x="36" y="132" width="16" height="64" rx="8" class="m3"/><rect x="62" y="132" width="16" height="64" rx="8" class="m3"/>
        <text x="12" y="210" class="label">Breacher</text>
      </g>
    </g>
    <text x="20" y="322" class="note">헬멧, 어깨, 가슴 장갑, 실드, 총기 길이, 백팩에서 역할이 읽혀야 한다.</text>
  </g>

  <g transform="translate(812,132)">
